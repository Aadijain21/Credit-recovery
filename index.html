<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Onboarding — Credit Recovery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo">💳 Credit Recovery</div>
        <div class="header-tagline">Understand & Recover Your Credit Health</div>
    </header>

    <div class="page-container">
        <div class="form-container">
            <h2>👤 Welcome to Credit Recovery</h2>
            <p class="subtitle">Enter your basic details to start managing and improving your credit health.</p>

            <form id="onboardingForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="e.g. Aaditya Sharma" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g. 9876543210" maxlength="10" required>

                <label for="pan">PAN Number</label>
                <input type="text" id="pan" placeholder="e.g. ABCDE1234F" maxlength="10" style="text-transform: uppercase;" required>

                <button type="submit" id="continueBtn">Continue to Dashboard →</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { getProfile, saveProfile } from "./creditData.js";

        // Pre-fill if already in session
        const current = getProfile();
        if (current.name) document.getElementById("name").value = current.name;
        if (current.phone) document.getElementById("phone").value = current.phone;
        if (current.pan) document.getElementById("pan").value = current.pan;

        document.getElementById("onboardingForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const pan = document.getElementById("pan").value.trim().toUpperCase();

            if (!name || !phone || !pan) {
                alert("Please fill in Name, Phone, and PAN number.");
                return;
            }

            saveProfile({ name, phone, pan });
            window.location.href = "dashboard.html";
        });
    </script>

</body>
</html>
