<!DOCTYPE html>
<html>
<head>
    <title>Credit Recovery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Credit Recovery</h1>

    <div class="form-container">

        <h2>Enter Your Credit Information</h2>

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Credit Score</label>
        <input type="number" id="creditScore" placeholder="300 - 900">

        <label>Monthly Income (₹)</label>
        <input type="number" id="income" placeholder="Example: 30000">

        <label>Total Credit Limit (₹)</label>
        <input type="number" id="creditLimit" placeholder="Example: 100000">

        <label>Outstanding Credit Card Balance (₹)</label>
        <input type="number" id="outstandingBalance" placeholder="Example: 70000">

        <label>Late Payments</label>
        <input type="number" id="latePayments" placeholder="Example: 2">

        <label>Active Loans</label>
        <input type="number" id="activeLoans" placeholder="Example: 2">

        <label>Recent Credit Inquiries</label>
        <input type="number" id="recentInquiries" placeholder="Example: 3">

        <button id="analyzeBtn">Analyze My Credit</button>

        <div id="result"></div>

        <div id="recoveryPlan"></div>

        <div id="roadmap"></div>

        <div id="progressSection"></div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
